name: Deploy SS-Courses Zensical Site to GitHub Pages

on:
  push:
    branches:
      - main # Cambia a 'master' si tu rama se llama así

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Construir imagen de Docker
        run: docker build -t zensical-builder .

      - name: Generar sitio estático con Zensical en Docker
        run: docker run --rm -v ${{ github.workspace }}:/docs -w /docs --entrypoint sh zensical-builder -c "zensical build || mkdocs build || python -m mkdocs build"

      - name: Verificar archivos generados
        run: ls -la site

      - name: Subir artefactos de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4